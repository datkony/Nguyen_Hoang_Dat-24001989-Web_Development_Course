<!doctype html>
<!-- Khai báo ngôn ngữ của trang là tiếng Việt để trình duyệt và công cụ hỗ trợ hiểu đúng nội dung. -->
<html lang="vi">
  <head>
    <!-- Khai báo bảng mã UTF-8 để hiển thị chính xác tiếng Việt có dấu. -->
    <meta charset="UTF-8" />
    <!-- Thiết lập chế độ hiển thị responsive để giao diện co giãn đúng trên thiết bị di động. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Mô tả ngắn gọn nội dung của ứng dụng cho công cụ tìm kiếm và trình duyệt. -->
    <meta
      name="description"
      content="Bài 3 - Giỏ hàng Vue 3 với component cha quản lý dữ liệu và component con dong-gio-hang."
    />
    <!-- Đặt tiêu đề hiển thị trên tab trình duyệt. -->
    <title>Bài 3 - Giỏ hàng Vue 3</title>
  </head>
  <body>
    <!-- Phần tử gốc để Vue gắn toàn bộ ứng dụng vào sau khi tạo app. -->
    <div id="app"></div>
    <!-- Tải tệp khởi động chính của ứng dụng dưới dạng module ES. -->
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
