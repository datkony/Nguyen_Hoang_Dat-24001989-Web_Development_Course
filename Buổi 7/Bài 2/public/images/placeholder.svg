<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-label="Ảnh sản phẩm chưa cập nhật">
  <!-- Vẽ nền xám nhạt cho ảnh giữ chỗ. -->
  <rect width="800" height="600" fill="#e2e8f0" />
  <!-- Vẽ khung ảnh đơn giản để nhận biết đây là ảnh thay thế. -->
  <rect x="250" y="170" width="300" height="220" rx="24" fill="none" stroke="#94a3b8" stroke-width="12" />
  <!-- Vẽ hình tròn tượng trưng cho mặt trời trong khung. -->
  <circle cx="430" cy="240" r="30" fill="#94a3b8" />
  <!-- Vẽ hình ngọn núi trong khung ảnh. -->
  <path d="M270 370 L360 280 L430 350 L480 310 L530 370 Z" fill="#94a3b8" />
  <!-- Hiển thị dòng chữ thông báo chưa có ảnh. -->
  <text x="400" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="34" fill="#64748b">Chưa có ảnh</text>
</svg>
