<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-label="Bàn phím cơ">
  <!-- Định nghĩa gradient nền xanh ngọc cho ảnh bàn phím. -->
  <defs>
    <linearGradient id="nen-ban-phim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f766e" />
      <stop offset="1" stop-color="#22d3ee" />
    </linearGradient>
  </defs>
  <!-- Vẽ nền gradient phủ toàn bộ khung ảnh. -->
  <rect width="800" height="600" fill="url(#nen-ban-phim)" />
  <!-- Vẽ vòng tròn trang trí mờ phía sau bàn phím. -->
  <circle cx="400" cy="310" r="235" fill="rgba(255, 255, 255, 0.08)" />
  <!-- Vẽ thân bàn phím dạng khối bo góc. -->
  <rect x="120" y="190" width="560" height="240" rx="28" fill="#f8fafc" />
  <!-- Vẽ hàng phím thứ nhất. -->
  <g fill="#0f766e">
    <rect x="150" y="220" width="54" height="42" rx="9" />
    <rect x="216" y="220" width="54" height="42" rx="9" />
    <rect x="282" y="220" width="54" height="42" rx="9" />
    <rect x="348" y="220" width="54" height="42" rx="9" />
    <rect x="414" y="220" width="54" height="42" rx="9" />
    <rect x="480" y="220" width="54" height="42" rx="9" />
    <rect x="546" y="220" width="104" height="42" rx="9" />
  </g>
  <!-- Vẽ hàng phím thứ hai. -->
  <g fill="#14b8a6">
    <rect x="150" y="276" width="72" height="42" rx="9" />
    <rect x="234" y="276" width="54" height="42" rx="9" />
    <rect x="300" y="276" width="54" height="42" rx="9" />
    <rect x="366" y="276" width="54" height="42" rx="9" />
    <rect x="432" y="276" width="54" height="42" rx="9" />
    <rect x="498" y="276" width="54" height="42" rx="9" />
    <rect x="564" y="276" width="86" height="42" rx="9" />
  </g>
  <!-- Vẽ hàng phím thứ ba. -->
  <g fill="#0d9488">
    <rect x="150" y="332" width="90" height="42" rx="9" />
    <rect x="252" y="332" width="54" height="42" rx="9" />
    <rect x="318" y="332" width="54" height="42" rx="9" />
    <rect x="384" y="332" width="200" height="42" rx="9" />
    <rect x="596" y="332" width="54" height="42" rx="9" />
  </g>
  <!-- Vẽ hàng phím thứ tư. -->
  <g fill="#0f766e">
    <rect x="150" y="388" width="70" height="24" rx="7" />
    <rect x="232" y="388" width="70" height="24" rx="7" />
    <rect x="314" y="388" width="250" height="24" rx="7" />
    <rect x="576" y="388" width="74" height="24" rx="7" />
  </g>
</svg>
