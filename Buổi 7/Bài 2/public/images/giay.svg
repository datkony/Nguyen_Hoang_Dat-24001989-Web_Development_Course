<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-label="Giày sneaker">
  <!-- Định nghĩa gradient nền xanh dương cho ảnh giày. -->
  <defs>
    <linearGradient id="nen-giay" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d4ed8" />
      <stop offset="1" stop-color="#22d3ee" />
    </linearGradient>
  </defs>
  <!-- Vẽ nền gradient phủ toàn bộ khung ảnh. -->
  <rect width="800" height="600" fill="url(#nen-giay)" />
  <!-- Vẽ vòng tròn trang trí mờ phía sau giày. -->
  <circle cx="400" cy="310" r="230" fill="rgba(255, 255, 255, 0.09)" />
  <!-- Vẽ thân giày với đường cong mềm mại. -->
  <path d="M170 380 Q170 300 245 270 L330 240 Q365 228 390 255 L445 315 Q470 345 515 352 L615 365 Q665 372 672 412 L675 430 Q675 455 645 455 H205 Q170 455 170 420 Z" fill="#ffffff" />
  <!-- Vẽ phần mũi giày bằng màu xanh đậm. -->
  <path d="M170 380 Q170 330 205 305 L300 255 L345 305 Q315 360 280 392 L205 420 Q170 425 170 380 Z" fill="#dbeafe" />
  <!-- Vẽ dây giày thứ nhất. -->
  <path d="M330 300 L390 318" stroke="#1d4ed8" stroke-width="12" stroke-linecap="round" />
  <!-- Vẽ dây giày thứ hai. -->
  <path d="M350 330 L410 348" stroke="#1d4ed8" stroke-width="12" stroke-linecap="round" />
  <!-- Vẽ dây giày thứ ba. -->
  <path d="M370 360 L430 378" stroke="#1d4ed8" stroke-width="12" stroke-linecap="round" />
  <!-- Vẽ miếng đệm cổ giày. -->
  <path d="M170 380 Q170 340 200 315 L250 285 Q280 270 300 290 L255 330 Q220 355 205 395 Z" fill="#93c5fd" />
  <!-- Vẽ đế giày màu xanh đậm. -->
  <path d="M170 420 Q170 455 205 455 H645 Q675 455 675 430 L673 415 Q655 440 615 440 H205 Q185 440 180 420 Z" fill="#1e3a8a" />
  <!-- Vẽ logo nhỏ trên thân giày. -->
  <path d="M500 385 Q545 365 590 380 Q555 400 508 402 Z" fill="#22d3ee" opacity="0.85" />
  <!-- Vẽ các đường may trang trí trên thân giày. -->
  <path d="M450 330 Q505 345 560 350" fill="none" stroke="#cbd5e1" stroke-width="5" stroke-linecap="round" />
  <!-- Vẽ đường may thứ hai. -->
  <path d="M470 300 Q520 315 575 320" fill="none" stroke="#cbd5e1" stroke-width="5" stroke-linecap="round" />
</svg>
