<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-label="Màn hình máy tính 24 inch">
  <!-- Định nghĩa gradient nền cam hồng cho ảnh màn hình. -->
  <defs>
    <linearGradient id="nen-man-hinh" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ea580c" />
      <stop offset="1" stop-color="#f472b6" />
    </linearGradient>
  </defs>
  <!-- Vẽ nền gradient phủ toàn bộ khung ảnh. -->
  <rect width="800" height="600" fill="url(#nen-man-hinh)" />
  <!-- Vẽ vòng tròn trang trí mờ phía sau màn hình. -->
  <circle cx="400" cy="300" r="230" fill="rgba(255, 255, 255, 0.09)" />
  <!-- Vẽ viền ngoài của màn hình. -->
  <rect x="145" y="160" width="510" height="300" rx="24" fill="#ffffff" />
  <!-- Vẽ vùng hiển thị bên trong màn hình. -->
  <rect x="170" y="185" width="460" height="236" rx="12" fill="#1e293b" />
  <!-- Vẽ dải màu chuyển sắc trên màn hình để tạo cảm giác đang hiển thị nội dung. -->
  <rect x="194" y="209" width="180" height="18" rx="9" fill="#f97316" />
  <!-- Vẽ dòng nội dung thứ hai. -->
  <rect x="194" y="243" width="280" height="12" rx="6" fill="#94a3b8" />
  <!-- Vẽ dòng nội dung thứ ba. -->
  <rect x="194" y="269" width="230" height="12" rx="6" fill="#64748b" />
  <!-- Vẽ một khối nội dung nổi bật bên phải màn hình. -->
  <rect x="500" y="209" width="106" height="120" rx="14" fill="#f472b6" />
  <!-- Vẽ chân đế của màn hình. -->
  <rect x="370" y="460" width="60" height="46" fill="#ffffff" />
  <!-- Vẽ đế màn hình. -->
  <rect x="290" y="506" width="220" height="22" rx="11" fill="#ffffff" />
  <!-- Vẽ đèn báo nguồn nhỏ dưới màn hình. -->
  <circle cx="400" cy="448" r="5" fill="#22c55e" />
</svg>
